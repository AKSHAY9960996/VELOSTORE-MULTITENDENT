{% extends 'master/base.html' %}

{% block title %}Master Admin Login | VeloStore Hub{% endblock %}

{% block content %}
<div style="max-width: 440px; margin: 40px auto; width: 100%;">
  <div style="background: var(--bg-card); border: 1px solid var(--border-accent); border-radius: var(--radius-lg); padding: 40px; box-shadow: var(--shadow-premium); backdrop-filter: blur(20px);">
    
    <div style="text-align: center; margin-bottom: 32px;">
      <div style="width: 64px; height: 64px; border-radius: 20px; background: linear-gradient(135deg, #6366f1, #8b5cf6); display: inline-flex; align-items: center; justify-content: center; font-size: 2rem; margin-bottom: 16px; box-shadow: 0 8px 24px var(--primary-glow);">⚡</div>
      <h2 style="font-size: 1.75rem; font-weight: 800; color: #fff; margin-bottom: 6px;">Master System Sign In</h2>
      <p style="font-size: 0.88rem; color: var(--text-muted);">Enter master administrator credentials to access platform controls</p>
    </div>

    <form method="POST" action="{{ url_for('master_login') }}">
    {{ csrf_field() }}
      <div style="margin-bottom: 20px;">
        <label for="username" style="display: block; font-size: 0.82rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 8px;">Master Username</label>
        <input type="text" id="username" name="username" required placeholder="e.g. master"
               style="width: 100%; padding: 12px 16px; border-radius: var(--radius-md); background: rgba(255,255,255,0.04); border: 1px solid var(--border-color); color: #fff; font-size: 0.95rem; outline: none; transition: all 0.2s ease;"
               class="focus-ring" />
      </div>

      <div style="margin-bottom: 28px;">
        <label for="password" style="display: block; font-size: 0.82rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 8px;">Master Password</label>
        <input type="password" id="password" name="password" required placeholder="••••••••"
               style="width: 100%; padding: 12px 16px; border-radius: var(--radius-md); background: rgba(255,255,255,0.04); border: 1px solid var(--border-color); color: #fff; font-size: 0.95rem; outline: none; transition: all 0.2s ease;"
               class="focus-ring" />
      </div>

      <button type="submit" class="nav-btn nav-btn-primary" style="width: 100%; padding: 14px; font-size: 1rem; justify-content: center;">
        Sign In to Master Panel →
      </button>
    </form>

  </div>
</div>
{% endblock %}
